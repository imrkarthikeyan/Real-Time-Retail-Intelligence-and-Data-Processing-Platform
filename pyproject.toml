[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Real-time retail intelligence and data processing platform"
requires-python = ">=3.11"
dependencies = [
  "faker>=24,<40",
  "pandas>=2.0,<3",
  "pyarrow>=15,<20",
  "psycopg[binary]>=3.1,<4",
  "pydantic-settings>=2.0,<3",
  "boto3>=1.34,<2",
  "pyspark==3.5.3",
  "streamlit>=1.35,<2",
  "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
retailpulse-generate = "retailpulse.generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
